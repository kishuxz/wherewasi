name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push or a quick follow-up commit should cancel the run it replaces
# rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the version from `packageManager`, so CI resolves the same pnpm
      # the lockfile was written by.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      # Frozen: a lockfile that no longer matches package.json should fail here
      # rather than be silently resolved into something nobody tested.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # The published artifact is what users actually run, so exercise it —
      # a build that emits an unrunnable entrypoint passes every step above.
      - name: Smoke-test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

      # We generate shell code for four shells, and unit tests can only assert
      # that strings contain substrings. The fish snippet shipped as a syntax
      # error for exactly that reason. Parse each one with its real shell.
      - name: Install shells for syntax checking
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh

      - name: Parse every generated shell integration
        run: |
          set -e
          node -e "import('./dist/hooks.js').then(m=>process.stdout.write(m.postCheckoutHook('/usr/bin/node','/x/cli.js')))" > /tmp/hook.sh
          sh -n /tmp/hook.sh

          node dist/cli.js shell-init bash > /tmp/init.bash && bash -n /tmp/init.bash
          node dist/cli.js shell-init zsh  > /tmp/init.zsh  && zsh  -n /tmp/init.zsh
          node dist/cli.js shell-init fish > /tmp/init.fish && fish -n /tmp/init.fish
